<!-- Estilos CSS (podés pasarlos a tu archivo CSS principal) -->
<style>
  .store-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    padding: 20px;
  }

  .account-card {
    background-color: #12141c;
    border: 1px solid #1f2430;
    border-radius: 10px;
    padding: 20px;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }

  .account-card:hover {
    transform: translateY(-3px);
    border-color: #f3ba2f;
  }

  .card-header {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 10px;
  }

  .card-body {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: #f8fafc;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #1f2430;
    padding-top: 12px;
  }

  .card-price {
    font-size: 1.25rem;
    font-weight: bold;
    color: #ffffff;
  }

  .card-instant {
    font-size: 0.85rem;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 5px;
  }
</style>

<!-- Contenedor donde se cargarán dinámicamente las cuentas -->
<div id="contenedor-cuentas" class="store-grid">
  <!-- Las tarjetas se inyectarán acá automáticamente -->
</div>

<!-- Script de conexión a Firestore y renderizado -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Reemplazá con tus credenciales reales de Firebase
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    projectId: "TU_PROJECT_ID",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "TU_MESSAGING_SENDER_ID",
    appId: "TU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function cargarCuentasTienda() {
    const contenedor = document.getElementById('contenedor-cuentas');
    contenedor.innerHTML = '<p style="color: #94a3b8;">Cargando cuentas disponibles...</p>';

    try {
      const querySnapshot = await getDocs(collection(db, "skin")); // O tu colección de cuentas
      
      if (querySnapshot.empty) {
        contenedor.innerHTML = '<p style="color: #94a3b8;">No hay cuentas disponibles en este momento.</p>';
        return;
      }

      contenedor.innerHTML = ""; // Limpiar mensaje de carga

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const docId = docSnap.id;

        // Estructura visual de cada tarjeta basada en tu ejemplo
        const card = document.createElement('div');
        card.className = 'account-card';
        card.innerHTML = `
          <div class="card-header">
            ${data.server || 'Latin America North'} · ${data.championCount || '1-19'} · ${data.currentRank || 'Unranked'} · RP: ${data.riotPoints || '0-999'}
          </div>
          <div class="card-body">
            <div class="card-title">${data.title || 'Cuenta Nivel 30 Handleveled'}</div>
          </div>
          <div class="card-footer">
            <div class="card-price">ARS ${data.price || '0.00'}</div>
            <div class="card-instant">⏱ Instant</div>
          </div>
        `;

        // Evento al hacer clic en la tarjeta (para abrir los detalles o la pasarela)
        card.addEventListener('click', () => {
          verDetallesCuenta(docId, data);
        });

        contenedor.appendChild(card);
      });

    } catch (error) {
      console.error("Error al cargar las cuentas:", error);
      contenedor.innerHTML = '<p style="color: #ef4444;">Hubo un error al cargar las cuentas.</p>';
    }
  }

  function verDetallesCuenta(id, data) {
    // Acá podés redirigir a una vista de detalle o abrir un modal con la info completa (Servidor, Garantía, Skins, etc.)
    console.log("Abriendo detalles de la cuenta:", id, data);
    alert(`Seleccionaste la cuenta: ${data.title} - Precio: ARS ${data.price}`);
  }

  document.addEventListener("DOMContentLoaded", cargarCuentasTienda);
</script>
