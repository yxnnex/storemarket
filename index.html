<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP Store - Boost Pro</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1250px;
            width: 100%;
            margin: 0 auto;
        }

        /* Navbar / Header expandido */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(18, 20, 28, 0.55);
            padding: 20px 25px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            box-sizing: border-box;
        }

        header h1 {
            font-size: 1.8rem;
            color: #fbbf24;
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.85rem;
            color: #8a99ad;
            margin: 4px 0 0 0;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #0b0e14;
            border: 1px solid #2d3748;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: #fbbf24;
            border-color: #fbbf24;
            color: #0b0e14;
        }

        /* Contenedor Principal (Boost Pro) adaptable */
        .boost-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 340px;
            gap: 20px;
            align-items: start;
            width: 100%;
        }

        .panel, .checkout-panel {
            background: rgba(18, 20, 28, 0.55);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            width: 100%;
            box-sizing: border-box;
        }

        .panel h3, .checkout-panel h3 {
            font-size: 0.95rem;
            color: #f8fafc;
            margin-bottom: 15px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: rgba(11, 14, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: #0b0e14;
            border: 1px solid #2d3748;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tab.active {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0b0e14;
            font-weight: bold;
        }

        .checkbox-group {
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
        }

        #promoBanner {
            background: linear-gradient(135deg, rgba(243, 186, 47, 0.2), rgba(56, 189, 248, 0.15));
            border: 1px solid rgba(243, 186, 47, 0.4);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #fef08a;
            margin: 15px 0;
            line-height: 1.4;
            display: none;
            text-align: center;
        }

        .price {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fbbf24;
            text-align: center;
            margin: 15px 0;
        }

        .btn-submit {
            background: #fbbf24;
            color: #0b0e14;
            border: none;
            padding: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            font-size: 0.95rem;
        }

        /* Sección de Cuentas (Firebase) */
        .cuentas-container {
            width: 100%;
            display: none;
        }

        .cuentas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
        }

        .cuenta-card {
            background: #121824;
            border: 1px solid #232d3f;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header / Navbar -->
        <header>
            <div>
                <h1>LP Store</h1>
                <p>Cuentas verificadas y servicio profesional</p>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn active">Cuentas</button>
                <button class="nav-btn">Boost Pro</button>
            </div>
        </header>

        <!-- Contenedor Boost Pro con los nuevos rangos de LP -->
        <div class="boost-layout">
            <!-- Panel 1 -->
            <div class="panel">
                <h3>Detalles del Servicio</h3>
                <div class="form-group">
                    <label for="lpGanados">¿Cuántos LP obtienes x victoria?</label>
                    <select id="lpGanados">
                        <option value="17-19">17 a 19 LP</option>
                        <option value="20-25">20 a 25 LP</option>
                        <option value="25-30">25 a 30 LP</option>
                    </select>
                </div>
            </div>

            <!-- Panel 2 (Ejemplo extra para completar la grilla) -->
            <div class="panel">
                <h3>Opciones Adicionales</h3>
                <div class="checkbox-group">
                    <input type="checkbox" id="duoBoost">
                    <label for="duoBoost" style="display:inline; margin:0;">Duo Boost (+50%)</label>
                </div>
            </div>

            <!-- Checkout Panel -->
            <div class="checkout-panel">
                <div>
                    <h3>Resumen</h3>
                    <div id="promoBanner">¡Tienes un descuento aplicado!</div>
                    <div class="price">$0.00</div>
                </div>
                <button class="btn-submit">Contratar Servicio</button>
            </div>
        </div>
    </div>

</body>
</html>
