<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - Boost Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #07090e; color: #ffffff; padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* ESTILOS DE LA CALCULADORA */
        .boost-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 340px;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 1024px) { .boost-layout { grid-template-columns: 1fr; } }

        .boost-card {
            background: rgba(18, 20, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 24px;
        }
        .rank-header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
            background: rgba(11, 14, 20, 0.4); padding: 14px; border-radius: 12px;
        }
        .rank-emblem { width: 45px; height: 45px; object-fit: contain; }
        .rank-info span { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .rank-info h3 { font-size: 1.1rem; color: #f8fafc; }

        .form-row { display: grid; grid-template-columns: 1.5fr 1.3fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { display: block; font-size: 0.78rem; color: #94a3b8; margin-bottom: 6px; }
        select, input {
            width: 100%; padding: 10px; background: rgba(11, 14, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; color: #ffffff; font-size: 0.85srem;
        }
        select:focus, input:focus { outline: none; border-color: #f3ba2f; }

        /* ALERTA DE OFERTA DINÁMICA */
        .promo-banner {
            background: linear-gradient(135deg, rgba(243, 186, 47, 0.2), rgba(56, 189, 248, 0.15));
            border: 1px solid rgba(243, 186, 47, 0.4);
            padding: 12px; border-radius: 8px; font-size: 0.8rem; color: #fef08a;
            text-align: center; margin-bottom: 12px; display: none;
        }

        .boost-total { font-size: 1.4rem; font-weight: bold; color: #f3ba2f; text-align: center; margin: 15px 0; }
        .btn-contratar {
            width: 100%; background-color: #f3ba2f; color: #0b0e14; border: none;
            padding: 13px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
        }
        .btn-contratar:hover { background-color: #e0a822; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-bottom: 20px; color: #f3ba2f;">Calculadora de Boost con Detección de Liga Entera</h2>
        
        <div class="boost-layout">
            <!-- Rango Actual -->
            <div class="boost-card">
                <div class="rank-header">
                    <img id="img-actual" class="rank-emblem" src="Hierro.png" alt="Actual">
                    <div class="rank-info">
                        <span>Rango actual</span>
                        <h3 id="txt-actual">Hierro Div. 4</h3>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Liga Actual</label>
                        <select id="liga-actual">
                            <option value="Hierro">Hierro</option>
                            <option value="Bronce">Bronce</option>
                            <option value="Plata">Plata</option>
                            <option value="Oro" selected>Oro</option>
                            <option value="Platino">Platino</option>
                            <option value="Esmeralda">Esmeralda</option>
                            <option value="Diamante">Diamante</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>División</label>
                        <select id="division-actual">
                            <option value="4">Div. IV</option>
                            <option value="3">Div. III</option>
                            <option value="2">Div. II</option>
                            <option value="1">Div. I</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>LP</label>
                        <input type="number" id="lp-actual" value="0" min="0" max="100">
                    </div>
                </div>
            </div>

            <!-- Rango Deseado -->
            <div class="boost-card">
                <div class="rank-header">
                    <img id="img-deseado" class="rank-emblem" src="Oro.png" alt="Deseado">
                    <div class="rank-info">
                        <span>Rango deseado</span>
                        <h3 id="txt-deseado">Oro Div. 1</h3>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Liga Deseada</label>
                        <select id="liga-deseada">
                            <option value="Hierro">Hierro</option>
                            <option value="Bronce">Bronce</option>
                            <option value="Plata">Plata</option>
                            <option value="Oro" selected>Oro</option>
                            <option value="Platino">Platino</option>
                            <option value="Esmeralda">Esmeralda</option>
                            <option value="Diamante">Diamante</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>División</label>
                        <select id="division-deseada">
                            <option value="4">Div. IV</option>
                            <option value="3">Div. III</option>
                            <option value="2">Div. II</option>
                            <option value="1" selected>Div. I</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>LP</label>
                        <input type="number" id="lp-deseado" value="0" min="0" max="100">
                    </div>
                </div>
            </div>

            <!-- Panel de Precio y Alerta -->
            <div class="boost-card">
                <h3 style="font-size: 0.95rem; margin-bottom: 15px;">RESUMEN</h3>
                
                <!-- ALERTA DINÁMICA DE OFERTA -->
                <div id="promo-banner" class="promo-banner">
                    🚀 <b>¡OFERTA LIGA COMPLETA!</b><br>Descuento aplicado.
                </div>

                <div class="boost-total">USD $<span id="precio-boost">0.00</span></div>
                <button class="btn-contratar" id="btn-contratar-boost">Obtener oferta</button>
            </div>
        </div>
    </div>

    <script>
        const ligasOrden = ["Hierro", "Bronce", "Plata", "Oro", "Platino", "Esmeralda", "Diamante"];
        const valoresLigas = { Hierro: 1, Bronce: 2, Plata: 3, Oro: 4, Platino: 5, Esmeralda: 6, Diamante: 7 };

        const ligaActual = document.getElementById('liga-actual');
        const divActual = document.getElementById('division-actual');
        const ligaDeseada = document.getElementById('liga-deseada');
        const divDeseada = document.getElementById('division-deseada');
        
        const txtActual = document.getElementById('txt-actual');
        const txtDeseado = document.getElementById('txt-deseado');
        const precioBoost = document.getElementById('precio-boost');
        const promoBanner = document.getElementById('promo-banner');
        const btnContratar = document.getElementById('btn-contratar-boost');

        function actualizarBoost() {
            const lAct = ligaActual.value;
            const dAct = divActual.value;
            const lDes = ligaDeseada.value;
            const dDes = divDeseada.value;

            txtActual.textContent = `${lAct} Div. ${dAct}`;
            txtDeseado.textContent = `${lDes} Div. ${dDes}`;

            const scoreActual = (valoresLigas[lAct] * 4) + (5 - parseInt(dAct));
            const scoreDeseado = (valoresLigas[lDes] * 4) + (5 - parseInt(dDes));
            const diff = scoreDeseado - scoreActual;

            // Tarifa base por división (ej: Oro a $7)
            let tarifaPorDivision = 7.00;
            if (lAct === "Hierro" || lAct === "Bronce") tarifaPorDivision = 5.00;
            if (lAct === "Platino" || lAct === "Esmeralda") tarifaPorDivision = 9.00;
            if (lAct === "Diamante") tarifaPorDivision = 12.00;

            let precio = diff > 0 ? diff * tarifaPorDivision : 0;

            // =========================================================================
            // DETECCIÓN AUTOMÁTICA DE LIGA ENTERA (Ej: Div. 4 a Div. 1 en el mismo rango)
            // =========================================================================
            let esLigaCompleta = (lAct === lDes && dAct === "4" && dDes === "1");

            if (esLigaCompleta) {
                // Porcentaje que aumenta conforme sube el elo
                let porcentajeDescuento = 0.05; // 5% en Hierro/Bronce
                if (lAct === "Plata" || lAct === "Oro") porcentajeDescuento = 0.08; // 8%
                if (lAct === "Platino" || lAct === "Esmeralda") porcentajeDescuento = 0.12; // 12%
                if (lAct === "Diamante") porcentajeDescuento = 0.15; // 15%

                // Regla especial pedida: en Hierro si salía $5 a la última división, se le saca $2 (no $3)
                let descuentoMonto = (lAct === "Hierro") ? 2.00 : (precio * porcentajeDescuento);
                
                precio -= descuentoMonto;

                let indexLigaActual = ligasOrden.indexOf(lAct);
                let siguienteLiga = ligasOrden[indexLigaActual + 1] || "la siguiente liga";

                // Muestra la alerta inteligente en el cartel
                promoBanner.innerHTML = `🚀 <b>¡OFERTA LIGA COMPLETA!</b><br>Si contratas una liga entera de <b>${lAct} IV</b> a <b>${lAct} I</b> (¡a un paso de ${siguienteLiga}!), se aplica tu descuento especial.`;
                promoBanner.style.display = "block";
                btnContratar.textContent = `¡Aprovechar Oferta de ${lAct}!`;
            } else {
                promoBanner.style.display = "none";
                btnContratar.textContent = "Obtener oferta";
            }

            precioBoost.textContent = precio > 0 ? precio.toFixed(2) : "0.00";
        }

        [ligaActual, divActual, ligaDeseada, divDeseada].forEach(el => {
            el.addEventListener('change', actualizarBoost);
        });

        actualizarBoost();
    </script>
</body>
</html>
