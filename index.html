<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - Cuentas de LoL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif, Tahoma, Geneva, Verdana;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2430;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #f3ba2f;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 1.4rem;
            color: #f8fafc;
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .account-card {
            background-color: #12141c;
            border: 1px solid #1f2430;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .account-card:hover {
            transform: translateY(-4px);
            border-color: #f3ba2f;
        }

        .card-header {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .card-body {
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1f2430;
            padding-top: 14px;
        }

        .card-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .card-instant {
            font-size: 0.85rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .mensaje-vacio {
            color: #94a3b8;
            font-size: 1rem;
            grid-column: 1 / -1;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ NEXUS<span>STORE</span></div>
    </header>

    <section>
        <h2>Cuentas Disponibles</h2>
        <p style="color: #94a3b8;">Entrega rápida tras verificación de pago por ticket.</p>

        <!-- Contenedor donde se cargan dinámicamente las cuentas desde Firestore -->
        <div id="contenedor-cuentas" class="store-grid">
            <div class="mensaje-vacio">Cargando cuentas desde la base de datos...</div>
        </div>
    </section>

    <!-- Script de conexión a Firebase con tus datos reales -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVGo2MoRA0cXgPMb7O3dVxDJVxG_iC1kQ",
            authDomain: "store-51d80.firebaseapp.com",
            projectId: "store-51d80",
            storageBucket: "store-51d80.firebasestorage.app",
            messagingSenderId: "695612329327",
            appId: "1:695612329327:web:298cea611bd736e3a36c9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarCuentasTienda() {
            const contenedor = document.getElementById('contenedor-cuentas');

            try {
                const querySnapshot = await getDocs(collection(db, "skin"));
                
                if (querySnapshot.empty) {
                    contenedor.innerHTML = '<div class="mensaje-vacio">No hay cuentas disponibles en este momento.</div>';
                    return;
                }

                contenedor.innerHTML = ""; 

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();

                    const card = document.createElement('div');
                    card.className = 'account-card';
                    
                    const servidor = data.server || 'Latin America North';
                    const campeones = data.championCount || '1-19';
                    const rango = data.currentRank || 'Unranked';
                    const rp = data.riotPoints || '0-999';
                    const titulo = data.title || 'Cuenta Nivel 30 Handleveled';
                    const precio = data.price || '0.00';

                    card.innerHTML = `
                        <div class="card-header">
                            ${servidor} · ${campeones} · ${rango} · RP: ${rp}
                        </div>
                        <div class="card-body">
                            <div class="card-title">${titulo}</div>
                        </div>
                        <div class="card-footer">
                            <div class="card-price">ARS ${precio}</div>
                            <div class="card-instant">⏱ Instant</div>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        alert(`Seleccionaste la cuenta: ${titulo} - Precio: ARS ${precio}`);
                    });

                    contenedor.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar las cuentas:", error);
                contenedor.innerHTML = '<div class="mensaje-vacio" style="color: #ef4444;">Hubo un error al conectar con la base de datos.</div>';
            }
        }

        document.addEventListener("DOMContentLoaded", cargarCuentasTienda);
    </script>
</body>
</html>
