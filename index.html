<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - Boost</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div>
            <div class="logo-title">NEXUS STORE</div>
            <div class="logo-subtitle">Cuentas sin correo verificado, listas para transferir</div>
        </div>
        <div class="header-nav">
            <button class="nav-btn">Cuentas</button>
            <button class="nav-btn boost-pro">Boost Pro</button>
        </div>
    </header>

    <div class="tabs-container">
        <button class="tab active">
            <img src="unranked.png" alt="Logo LoL"> Impulso de rango
        </button>
        <button class="tab">Partidas de posicionamiento</button>
        <button class="tab">Victorias netas</button>
    </div>

    <div class="main-container">
        <!-- Selector Rango Actual -->
        <div class="card-selector">
            <div class="card-header-title">
                <img id="img-actual" src="Platino.png" alt="Rango Actual">
                <div class="title-text">
                    <span>Rango Actual</span>
                    <h3 id="txt-actual">Platino Div. 4</h3>
                </div>
            </div>

            <div class="form-group">
                <label>Liga Actual</label>
                <div class="select-row">
                    <select id="liga-actual">
                        <option value="Hierro">Hierro</option>
                        <option value="Bronce">Bronce</option>
                        <option value="Plata">Plata</option>
                        <option value="Oro">Oro</option>
                        <option value="Platino" selected>Platino</option>
                        <option value="Esmeralda">Esmeralda</option>
                        <option value="Diamante">Diamante</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>División</label>
                <select id="div-actual">
                    <option value="IV" selected>Div. IV</option>
                    <option value="III">Div. III</option>
                    <option value="II">Div. II</option>
                    <option value="I">Div. I</option>
                </select>
            </div>

            <div class="form-group">
                <label>LP (opc.)</label>
                <input type="number" id="lp-actual" value="0" min="0" max="99">
            </div>

            <div class="form-group">
                <label class="lp-label">¿Cuantos LP obtienes x victoria?</label>
                <select id="lp-ganancia">
                    <option value="17-19">17 a 19 LP</option>
                    <option value="19-22">19 a 22 LP</option>
                    <option value="22-25" selected>22 a 25 LP</option>
                    <option value="25-30">25 a 30 LP</option>
                </select>
            </div>
        </div>

        <!-- Selector Rango Deseado -->
        <div class="card-selector">
            <div class="card-header-title">
                <img id="img-deseado" src="Platino.png" alt="Rango Deseado">
                <div class="title-text">
                    <span>Rango Deseado</span>
                    <h3 id="txt-deseado">Platino Div. 1</h3>
                </div>
            </div>

            <div class="form-group">
                <label>Liga Deseada</label>
                <div class="select-row">
                    <select id="liga-deseada">
                        <option value="Hierro">Hierro</option>
                        <option value="Bronce">Bronce</option>
                        <option value="Plata">Plata</option>
                        <option value="Oro">Oro</option>
                        <option value="Platino" selected>Platino</option>
                        <option value="Esmeralda">Esmeralda</option>
                        <option value="Diamante">Diamante</option>
                        <option value="Maestro">Maestro</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>División</label>
                <select id="div-deseada">
                    <option value="IV">Div. IV</option>
                    <option value="III">Div. III</option>
                    <option value="II">Div. II</option>
                    <option value="I" selected>Div. I</option>
                </select>
            </div>

            <div class="form-group">
                <label>LP (opc.)</label>
                <input type="number" id="lp-deseado" value="0" min="0" max="99">
            </div>
        </div>

        <!-- Panel de Pedido con el mapa de LoL detrás -->
        <div class="card-checkout-wrapper">
            <img src="mapalol.webp" alt="Mapa LoL" class="lol-map-bg">
            
            <div class="card-checkout">
                <div class="checkout-title">Personalizar Pedido</div>

                <div class="mode-selector">
                    <button class="mode-btn active" id="btn-soloq" onclick="setMode('soloq')">Solo Q</button>
                    <button class="mode-btn" id="btn-duo" onclick="setMode('duo')">Duo</button>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        Transmisión en vivo
                        <input type="checkbox" id="chk-streaming" onchange="actualizarBoost()">
                    </label>
                    <label class="checkbox-label">
                        Modo Offline
                        <input type="checkbox" id="chk-offline" onchange="actualizarBoost()">
                    </label>
                </div>

                <div id="promo-banner" class="promo-banner"></div>

                <div class="price-display" id="precio-boost">USD $23.76</div>

                <button class="submit-btn" id="btn-contratar">¡Aprovechar Oferta de Platino!</button>
            </div>
        </div>
    </div>

    <script>
        const ligasOrden = ["Hierro", "Bronce", "Plata", "Oro", "Platino", "Esmeralda", "Diamante", "Maestro"];
        
        const valoresLigas = {
            "Hierro": 0,
            "Bronce": 1,
            "Plata": 2,
            "Oro": 3,
            "Platino": 4,
            "Esmeralda": 5,
            "Diamante": 6,
            "Maestro": 7
        };

        const rangosEmblemas = {
            "Hierro": "Hierro.png",
            "Bronce": "Bronce.webp",
            "Plata": "Plata.png",
            "Oro": "Oro.png",
            "Platino": "Platino.png",
            "Esmeralda": "Esmeralda.png",
            "Diamante": "Diamante.png",
            "Maestro": "Maestro.png"
        };

        let modoSeleccionado = 'soloq';

        const ligaActual = document.getElementById('liga-actual');
        const divActual = document.getElementById('div-actual');
        const lpActual = document.getElementById('lp-actual');
        const lpGanancia = document.getElementById('lp-ganancia');

        const ligaDeseada = document.getElementById('liga-deseada');
        const divDeseada = document.getElementById('div-deseada');
        const lpDeseado = document.getElementById('lp-deseado');

        const imgActual = document.getElementById('img-actual');
        const txtActual = document.getElementById('txt-actual');
        const imgDeseado = document.getElementById('img-deseado');
        const txtDeseado = document.getElementById('txt-deseado');

        const promoBanner = document.getElementById('promo-banner');
        const precioBoost = document.getElementById('precio-boost');
        const btnContratar = document.getElementById('btn-contratar');

        function setMode(modo) {
            modoSeleccionado = modo;
            document.getElementById('btn-soloq').classList.toggle('active', modo === 'soloq');
            document.getElementById('btn-duo').classList.toggle('active', modo === 'duo');
            actualizarBoost();
        }

        function actualizarBoost() {
            const lAct = ligaActual.value;
            const dAct = divActual.value;
            const lDes = ligaDeseada.value;
            const dDes = divDeseada.value;

            imgActual.src = rangosEmblemas[lAct] || "Hierro.png";
            txtActual.textContent = `${lAct} Div. ${dAct}`;

            imgDeseado.src = rangosEmblemas[lDes] || "Hierro.png";
            txtDeseado.textContent = `${lDes} Div. ${dDes}`;

            const scoreActual = (valoresLigas[lAct] * 4) + (5 - parseInt(dAct));
            const scoreDeseado = (valoresLigas[lDes] * 4) + (5 - parseInt(dDes));
            const diff = scoreDeseado - scoreActual;

            let tarifaPorDivision = 7.00;
            if (lAct === "Hierro" || lAct === "Bronce") tarifaPorDivision = 5.00;
            if (lAct === "Platino" || lAct === "Esmeralda") tarifaPorDivision = 9.00;
            if (lAct === "Diamante") tarifaPorDivision = 12.00;

            let precioDivisiones = diff > 0 ? diff * tarifaPorDivision : 0;

            const multiplicadorLp = {
                '17-19': 1.20,
                '19-22': 1.10,
                '22-25': 1.00,
                '25-30': 0.90
            };
            let precio = precioDivisiones * (multiplicadorLp[lpGanancia.value] || 1.0);

            // Detección de la oferta dinámica para saltos a División 1 en la misma liga
            let esMismaLiga = (lAct === lDes);
            let esSaltoAbaDiv1 = (esMismaLiga && parseInt(dAct) > parseInt(dDes) && dDes === "1");

            if (esSaltoAbaDiv1) {
                let porcentajeDescuento = 0.05; 
                if (lAct === "Plata" || lAct === "Oro") porcentajeDescuento = 0.08; 
                if (lAct === "Platino" || lAct === "Esmeralda") porcentajeDescuento = 0.12; 
                if (lAct === "Diamante") porcentajeDescuento = 0.15; 

                let descuentoMonto = (lAct === "Hierro") ? 2.00 : (precio * porcentajeDescuento);
                precio -= descuentoMonto;

                let indexLigaActual = ligasOrden.indexOf(lAct);
                let siguienteLiga = ligasOrden[indexLigaActual + 1] || "la siguiente liga";

                promoBanner.innerHTML = `🚀 <b>¡OFERTA LIGA COMPLETA!</b><br>Estás contratando un impulso en la misma liga, ¡a un paso de <b>${siguienteLiga}</b>! Si Contratas a <b>${siguienteLiga}</b> ¡Obtienes un descuento especial!`;
                promoBanner.style.display = "block";
                btnContratar.textContent = `¡Aprovechar Oferta de ${lAct}!`;
            } else {
                promoBanner.style.display = "none";
                btnContratar.textContent = "Obtener oferta";
            }

            // Extras
            if (modoSeleccionado === 'duo') precio *= 1.3;
            if (document.getElementById('chk-streaming').checked) precio += 5;
            if (document.getElementById('chk-offline').checked) precio += 3;

            precioBoost.textContent = precio > 0 ? `USD $${precio.toFixed(2)}` : "USD $0.00";
            return precio > 0 ? precio : 0;
        }

        // Vincular eventos a los controles
        [ligaActual, divActual, lpActual, lpGanancia, ligaDeseada, divDeseada, lpDeseado].forEach(element => {
            element.addEventListener('change', actualizarBoost);
            element.addEventListener('input', actualizarBoost);
        });

        // Inicializar al cargar
        actualizarBoost();
    </script>
</body>
</html>
