<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #121620;
            --bg-card-inner: #161b26;
            --accent: #f3ba2f;
            --accent-hover: #e0a822;
            --text-main: #ffffff;
            --text-muted: #8a9ba8;
            --border-color: #222b3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .logo-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-nav {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active-view {
            border-color: var(--accent);
            color: var(--accent);
        }

        .nav-btn.boost-pro {
            background-color: var(--accent);
            color: #000;
            border: none;
        }

        .nav-btn.boost-pro:hover {
            background-color: var(--accent-hover);
            color: #000;
        }

        /* Vistas (Contenedores) */
        .view-section {
            display: none;
            width: 100%;
            max-width: 1200px;
            flex-direction: column;
            align-items: center;
        }

        .view-section.active {
            display: flex;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .tab {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .tab.active {
            background-color: var(--text-main);
            color: #000;
            border-color: var(--text-main);
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card-selector {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card-inner);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card-header-title img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .card-header-title .title-text span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-header-title .title-text h3 {
            font-size: 16px;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .select-row {
            display: flex;
            gap: 10px;
        }

        select, input[type="number"] {
            background-color: var(--bg-card-inner);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }

        .lp-label {
            text-align: center;
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            margin-top: 5px;
        }

        /* Panel derecho con mapa de fondo */
        .card-checkout-wrapper {
            position: relative;
            width: 360px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
        }

        .lol-map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.22;
            z-index: 1;
            pointer-events: none;
        }

        .card-checkout {
            position: relative;
            z-index: 2;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(18, 22, 32, 0.88);
            backdrop-filter: blur(4px);
            height: 100%;
        }

        .checkout-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .mode-selector {
            display: flex;
            background: var(--bg-card-inner);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background-color: #38bdf8;
            color: #000;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card-inner);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .promo-banner {
            background: linear-gradient(135deg, rgba(243, 186, 47, 0.15), rgba(20, 25, 35, 0.85));
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.4;
            color: #fffae6;
            display: none;
            text-align: center;
        }

        .price-display {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            margin: 5px 0;
        }

        .submit-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Estilos para la sección de Cuentas Firebase */
        .cuentas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .cuenta-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cuenta-card h4 {
            color: var(--accent);
            font-size: 18px;
        }

        .cuenta-card p {
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="logo-title">NEXUS STORE</div>
            <div class="logo-subtitle">Cuentas sin correo verificado, listas para transferir</div>
        </div>
        <div class="header-nav">
            <button class="nav-btn active-view" id="nav-cuentas" onclick="cambiarVista('cuentas')">Cuentas</button>
            <button class="nav-btn" id="nav-boost" onclick="cambiarVista('boost')">Boost Pro</button>
        </div>
    </header>

    <!-- VISTA 1: TIENDA DE CUENTAS (FIREBASE) -->
    <div id="vista-cuentas" class="view-section active">
        <h2 style="margin-bottom: 20px; color: var(--text-main);">Cuentas Disponibles</h2>
        <div id="lista-cuentas" class="cuentas-grid">
            <p style="color: var(--text-muted);">Cargando cuentas desde Firebase...</p>
        </div>
    </div>

    <!-- VISTA 2: CALCULADORA DE BOOST -->
    <div id="vista-boost" class="view-section">
        <div class="tabs-container">
            <button class="tab active">
                <img src="unranked.png" alt="Logo LoL"> Impulso de rango
            </button>
            <button class="tab">Partidas de posicionamiento</button>
            <button class="tab">Victorias netas</button>
        </div>

        <div class="main-container">
            <!-- Selector Rango Actual -->
            <div class="card-selector">
                <div class="card-header-title">
                    <img id="img-actual" src="Platino.png" alt="Rango Actual">
                    <div class="title-text">
                        <span>Rango Actual</span>
                        <h3 id="txt-actual">Platino Div. 4</h3>
                    </div>
                </div>

                <div class="form-group">
                    <label>Liga Actual</label>
                    <div class="select-row">
                        <select id="liga-actual">
                            <option value="Hierro">Hierro</option>
                            <option value="Bronce">Bronce</option>
                            <option value="Plata">Plata</option>
                            <option value="Oro">Oro</option>
                            <option value="Platino" selected>Platino</option>
                            <option value="Esmeralda">Esmeralda</option>
                            <option value="Diamante">Diamante</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>División</label>
                    <select id="div-actual">
                        <option value="IV" selected>Div. IV</option>
                        <option value="III">Div. III</option>
                        <option value="II">Div. II</option>
                        <option value="I">Div. I</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>LP (opc.)</label>
                    <input type="number" id="lp-actual" value="0" min="0" max="99">
                </div>

                <div class="form-group">
                    <label class="lp-label">¿Cuantos LP obtienes x victoria?</label>
                    <select id="lp-ganancia">
                        <option value="17-19">17 a 19 LP</option>
                        <option value="19-22">19 a 22 LP</option>
                        <option value="22-25" selected>22 a 25 LP</option>
                        <option value="25-30">25 a 30 LP</option>
                    </select>
                </div>
            </div>

            <!-- Selector Rango Deseado -->
            <div class="card-selector">
                <div class="card-header-title">
                    <img id="img-deseado" src="Platino.png" alt="Rango Deseado">
                    <div class="title-text">
                        <span>Rango Deseado</span>
                        <h3 id="txt-deseado">Platino Div. 1</h3>
                    </div>
                </div>

                <div class="form-group">
                    <label>Liga Deseada</label>
                    <div class="select-row">
                        <select id="liga-deseada">
                            <option value="Hierro">Hierro</option>
                            <option value="Bronce">Bronce</option>
                            <option value="Plata">Plata</option>
                            <option value="Oro">Oro</option>
                            <option value="Platino" selected>Platino</option>
                            <option value="Esmeralda">Esmeralda</option>
                            <option value="Diamante">Diamante</option>
                            <option value="Maestro">Maestro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>División</label>
                    <select id="div-deseada">
                        <option value="IV">Div. IV</option>
                        <option value="III">Div. III</option>
                        <option value="II">Div. II</option>
                        <option value="I" selected>Div. I</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>LP (opc.)</label>
                    <input type="number" id="lp-deseado" value="0" min="0" max="99">
                </div>
            </div>

            <!-- Panel de Pedido con el mapa de LoL detrás -->
            <div class="card-checkout-wrapper">
                <img src="mapalol.webp" alt="Mapa LoL" class="lol-map-bg">
                
                <div class="card-checkout">
                    <div class="checkout-title">Personalizar Pedido</div>

                    <div class="mode-selector">
                        <button class="mode-btn active" id="btn-soloq" onclick="setMode('soloq')">Solo Q</button>
                        <button class="mode-btn" id="btn-duo" onclick="setMode('duo')">Duo</button>
                    </div>

                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            Transmisión en vivo
                            <input type="checkbox" id="chk-streaming" onchange="actualizarBoost()">
                        </label>
                        <label class="checkbox-label">
                            Modo Offline
                            <input type="checkbox" id="chk-offline" onchange="actualizarBoost()">
                        </label>
                    </div>

                    <div id="promo-banner" class="promo-banner"></div>

                    <div class="price-display" id="precio-boost">USD $23.76</div>

                    <button class="submit-btn" id="btn-contratar">¡Aprovechar Oferta de Platino!</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Firebase (asegúrate de colocar tus credenciales aquí si las cambiaste)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase (si ya lo tenías configurado, mantendrá tu conexión)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Control de vistas (Cuentas vs Boost)
        function cambiarVista(vista) {
            document.getElementById('vista-cuentas').classList.toggle('active', vista === 'cuentas');
            document.getElementById('vista-boost').classList.toggle('active', vista === 'boost');
            document.getElementById('nav-cuentas').classList.toggle('active-view', vista === 'cuentas');
            document.getElementById('nav-boost').classList.toggle('active-view', vista === 'boost');

            if (vista === 'cuentas') {
                cargarCuentasFirebase();
            }
        }

        // Cargar cuentas desde Firestore
        function cargarCuentasFirebase() {
            const contenedor = document.getElementById('lista-cuentas');
            contenedor.innerHTML = '<p style="color: var(--text-muted);">Cargando cuentas...</p>';

            db.collection("cuentas").get().then((querySnapshot) => {
                if (querySnapshot.empty) {
                    contenedor.innerHTML = '<p style="color: var(--text-muted);">No hay cuentas disponibles por el momento.</p>';
                    return;
                }
                contenedor.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    contenedor.innerHTML += `
                        <div class="cuenta-card">
                            <h4>${data.titulo || 'Cuenta LoL'}</h4>
                            <p><b>Esencia Azul:</b> ${data.esencia || 'N/A'}</p>
                            <p><b>Servidor:</b> ${data.servidor || 'LAN/LAS'}</p>
                            <p style="color: var(--accent); font-weight: bold; font-size: 16px;">$${data.precio || '0.00'}</p>
                            <button class="submit-btn" style="padding: 8px; font-size: 13px;">Comprar Cuenta</button>
                        </div>
                    `;
                });
            }).catch((error) => {
                contenedor.innerHTML = `<p style="color: #ff4d4d;">Error al cargar cuentas de Firebase: ${error.message}</p>`;
            });
        }

        // Lógica de la calculadora de Boost
        const ligasOrden = ["Hierro", "Bronce", "Plata", "Oro", "Platino", "Esmeralda", "Diamante", "Maestro"];
        const valoresLigas = { "Hierro": 0, "Bronce": 1, "Plata": 2, "Oro": 3, "Platino": 4, "Esmeralda": 5, "Diamante": 6, "Maestro": 7 };
        const rangosEmblemas = { "Hierro": "Hierro.png", "Bronce": "Bronce.webp", "Plata": "Plata.png", "Oro": "Oro.png", "Platino": "Platino.png", "Esmeralda": "Esmeralda.png", "Diamante": "Diamante.png", "Maestro": "Maestro.png" };

        let modoSeleccionado = 'soloq';

        const ligaActual = document.getElementById('liga-actual');
        const divActual = document.getElementById('div-actual');
        const lpActual = document.getElementById('lp-actual');
        const lpGanancia = document.getElementById('lp-ganancia');
        const ligaDeseada = document.getElementById('liga-deseada');
        const divDeseada = document.getElementById('div-deseada');
        const lpDeseado = document.getElementById('lp-deseado');
        const imgActual = document.getElementById('img-actual');
        const txtActual = document.getElementById('txt-actual');
        const imgDeseado = document.getElementById('img-deseado');
        const txtDeseado = document.getElementById('txt-deseado');
        const promoBanner = document.getElementById('promo-banner');
        const precioBoost = document.getElementById('precio-boost');
        const btnContratar = document.getElementById('btn-contratar');

        function setMode(modo) {
            modoSeleccionado = modo;
            document.getElementById('btn-soloq').classList.toggle('active', modo === 'soloq');
            document.getElementById('btn-duo').classList.toggle('active', modo === 'duo');
            actualizarBoost();
        }

        function actualizarBoost() {
            if (!ligaActual) return;
            const lAct = ligaActual.value;
            const dAct = divActual.value;
            const lDes = ligaDeseada.value;
            const dDes = divDeseada.value;

            imgActual.src = rangosEmblemas[lAct] || "Hierro.png";
            txtActual.textContent = `${lAct} Div. ${dAct}`;
            imgDeseado.src = rangosEmblemas[lDes] || "Hierro.png";
            txtDeseado.textContent = `${lDes} Div. ${dDes}`;

            const scoreActual = (valoresLigas[lAct] * 4) + (5 - parseInt(dAct));
            const scoreDeseado = (valoresLigas[lDes] * 4) + (5 - parseInt(dDes));
            const diff = scoreDeseado - scoreActual;

            let tarifaPorDivision = 7.00;
            if (lAct === "Hierro" || lAct === "Bronce") tarifaPorDivision = 5.00;
            if (lAct === "Platino" || lAct === "Esmeralda") tarifaPorDivision = 9.00;
            if (lAct === "Diamante") tarifaPorDivision = 12.00;

            let precioDivisiones = diff > 0 ? diff * tarifaPorDivision : 0;
            const multiplicadorLp = { '17-19': 1.20, '19-22': 1.10, '22-25': 1.00, '25-30': 0.90 };
            let precio = precioDivisiones * (multiplicadorLp[lpGanancia.value] || 1.0);

            let esMismaLiga = (lAct === lDes);
            let esSaltoAbaDiv1 = (esMismaLiga && parseInt(dAct) > parseInt(dDes) && dDes === "1");

            if (esSaltoAbaDiv1) {
                let porcentajeDescuento = 0.05; 
                if (lAct === "Plata" || lAct === "Oro") porcentajeDescuento = 0.08; 
                if (lAct === "Platino" || lAct === "Esmeralda") porcentajeDescuento = 0.12; 
                if (lAct === "Diamante") porcentajeDescuento = 0.15; 

                let descuentoMonto = (lAct === "Hierro") ? 2.00 : (precio * porcentajeDescuento);
                precio -= descuentoMonto;

                let indexLigaActual = ligasOrden.indexOf(lAct);
                let siguienteLiga = ligasOrden[indexLigaActual + 1] || "la siguiente liga";

                promoBanner.innerHTML = `🚀 <b>¡OFERTA LIGA COMPLETA!</b><br>Estás contratando un impulso en la misma liga, ¡a un paso de <b>${siguienteLiga}</b>!`;
                promoBanner.style.display = "block";
                btnContratar.textContent = `¡Aprovechar Oferta de ${lAct}!`;
            } else {
                promoBanner.style.display = "none";
                btnContratar.textContent = "Obtener oferta";
            }

            if (modoSeleccionado === 'duo') precio *= 1.3;
            if (document.getElementById('chk-streaming').checked) precio += 5;
            if (document.getElementById('chk-offline').checked) precio += 3;

            precioBoost.textContent = precio > 0 ? `USD $${precio.toFixed(2)}` : "USD $0.00";
        }

        [ligaActual, divActual, lpActual, lpGanancia, ligaDeseada, divDeseada, lpDeseado].forEach(element => {
            if (element) {
                element.addEventListener('change', actualizarBoost);
                element.addEventListener('input', actualizarBoost);
            }
        });

        // Inicializar datos al cargar la página
        cargarCuentasFirebase();
        actualizarBoost();
    </script>
</body>
</html>
