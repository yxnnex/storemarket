<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header / Barra de Navegación -->
    <header>
        <div>
            <h1>Nexus Store</h1>
            <p>Cuentas sin correo verificado y Boost Pro</p>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn active" id="btnBoost" onclick="switchTab('boost')">Boost Pro</button>
            <button class="nav-btn" id="btnCuentas" onclick="switchTab('cuentas')">Cuentas</button>
        </div>
    </header>

    <!-- SECCIÓN: BOOST PRO -->
    <div class="container" id="sectionBoost">
        <!-- Panel Izquierdo: Liga Actual -->
        <div class="panel">
            <h3>Rango Actual</h3>
            <div class="form-group">
                <label>Liga Actual</label>
                <select id="ligaActual" onchange="actualizarBoost()">
                    <option value="Hierro">Hierro</option>
                    <option value="Bronce">Bronce</option>
                    <option value="Plata">Plata</option>
                    <option value="Oro">Oro</option>
                    <option value="Platino" selected>Platino</option>
                    <option value="Esmeralda">Esmeralda</option>
                    <option value="Diamante">Diamante</option>
                </select>
            </div>
            <div class="form-group">
                <label>División</label>
                <select id="divisionActual" onchange="actualizarBoost()">
                    <option value="IV" selected>Div. IV</option>
                    <option value="III">Div. III</option>
                    <option value="II">Div. II</option>
                    <option value="I">Div. I</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>¿Cuántos LP obtienes?</label>
                <select id="lpGanan">
                    <option>22 a 25 LP</option>
                </select>
            </div>
        </div>

        <!-- Panel Central: Liga Deseada -->
        <div class="panel">
            <h3>Rango Deseado</h3>
            <div class="form-group">
                <label>Liga Deseada</label>
                <select id="ligaDeseada" onchange="actualizarBoost()">
                    <option value="Hierro">Hierro</option>
                    <option value="Bronce">Bronce</option>
                    <option value="Plata">Plata</option>
                    <option value="Oro">Oro</option>
                    <option value="Platino" selected>Platino</option>
                    <option value="Esmeralda">Esmeralda</option>
                    <option value="Diamante">Diamante</option>
                </select>
            </div>
            <div class="form-group">
                <label>División</label>
                <select id="divisionDeseada" onchange="actualizarBoost()">
                    <option value="IV">Div. IV</option>
                    <option value="III">Div. III</option>
                    <option value="II">Div. II</option>
                    <option value="I" selected>Div. I</option>
                </select>
            </div>
        </div>

        <!-- Panel Derecho: Checkout / Personalizar -->
        <div class="checkout-panel">
            <div>
                <h3>Personalizar Pedido</h3>
                <div class="tabs">
                    <div class="tab active">Solo Q</div>
                    <div class="tab">Duo</div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="transmision">
                    <label for="transmision" style="display:inline; margin:0; cursor:pointer;">Transmisión en vivo</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="offline">
                    <label for="offline" style="display:inline; margin:0; cursor:pointer;">Modo Offline</label>
                </div>

                <!-- Banner de Oferta Dinámico -->
                <div id="promoBanner"></div>
            </div>

            <div>
                <div class="price" id="precioTotal">USD $23.76</div>
                <button class="btn-submit" id="btnAccion">¡Aprovechar Oferta!</button>
            </div>
        </div>
    </div>

    <!-- SECCIÓN: TIENDA DE CUENTAS (Firebase) -->
    <div class="cuentas-container" id="sectionCuentas">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: #fbbf24; text-transform: uppercase; font-size: 14px; margin:0;">Cuentas Disponibles en Stock</h3>
            <span id="contadorCuentas" style="font-size: 12px; color: #8a99ad;">Cargando...</span>
        </div>
        <div class="cuentas-grid" id="gridCuentas">
            <!-- Las cuentas se cargan dinámicamente aquí -->
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FIREBASE (Reemplaza con tus datos reales)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Control de pestañas
        function switchTab(tab) {
            const sectionBoost = document.getElementById('sectionBoost');
            const sectionCuentas = document.getElementById('sectionCuentas');
            const btnBoost = document.getElementById('btnBoost');
            const btnCuentas = document.getElementById('btnCuentas');

            if (tab === 'boost') {
                sectionBoost.style.display = 'flex';
                sectionCuentas.style.display = 'none';
                btnBoost.classList.add('active');
                btnCuentas.classList.remove('active');
            } else {
                sectionBoost.style.display = 'none';
                sectionCuentas.style.display = 'block';
                btnBoost.classList.remove('active');
                btnCuentas.classList.add('active');
                cargarCuentasFirebase();
            }
        }

        // Lógica de cálculo de Boost
        const ligasOrden = ["Hierro", "Bronce", "Plata", "Oro", "Platino", "Esmeralda", "Diamante"];

        function actualizarBoost() {
            let lAct = document.getElementById("ligaActual").value;
            let dAct = document.getElementById("divisionActual").value;
            let lDes = document.getElementById("ligaDeseada").value;
            let dDes = document.getElementById("divisionDeseada").value;

            let promoBanner = document.getElementById("promoBanner");
            let btnAccion = document.getElementById("btnAccion");

            let esMismaLiga = (lAct === lDes);
            let esLigaCompleta = (esMismaLiga && parseInt(dAct) > parseInt(dDes) && dDes === "1");

            if (esLigaCompleta) {
                let indexLigaActual = ligasOrden.indexOf(lAct);
                let siguienteLiga = ligasOrden[indexLigaActual + 1] || "la siguiente liga";

                promoBanner.innerHTML = `🚀 <b>¡OFERTA LIGA COMPLETA!</b><br>Estás contratando un impulso en la misma liga, ¡a un paso de <b>${siguienteLiga}</b>! ¡Obtienes un descuento especial!`;
                promoBanner.style.display = "block";
                btnAccion.innerText = `¡Aprovechar Oferta de ${lAct}!`;
            } else {
                promoBanner.style.display = "none";
                btnAccion.innerText = `¡Contratar Boost!`;
            }
        }

        // Carga de Cuentas desde Firebase Firestore
        function cargarCuentasFirebase() {
            const grid = document.getElementById('gridCuentas');
            const contador = document.getElementById('contadorCuentas');
            grid.innerHTML = '<p style="color: #8a99ad; font-size: 13px; grid-column: span 3; text-align: center; padding: 40px 0;">Sincronizando inventario...</p>';

            db.collection("cuentas").get()
                .then((querySnapshot) => {
                    grid.innerHTML = "";
                    if (querySnapshot.empty) {
                        contador.innerText = "0 cuentas";
                        grid.innerHTML = '<p style="color: #8a99ad; font-size: 13px; grid-column: span 3; text-align: center; padding: 40px 0;">No hay cuentas disponibles en este momento.</p>';
                        return;
                    }

                    contador.innerText = `${querySnapshot.size} disponibles`;

                    querySnapshot.forEach((doc) => {
                        const cuenta = doc.data();
                        const card = document.createElement('div');
                        card.className = "cuenta-card";
                        card.innerHTML = `
                            <div>
                                <div class="cuenta-header">
                                    <span class="cuenta-tag">${cuenta.servidor || 'LAS'}</span>
                                    <span class="cuenta-price">$${cuenta.precio || '0.00'}</span>
                                </div>
                                <h4 style="margin: 0 0 8px 0; font-size: 14px; color: #ffffff;">${cuenta.titulo || 'Cuenta LoL'}</h4>
                                <p style="margin: 0; font-size: 11px; color: #8a99ad; line-height: 1.4;">${cuenta.descripcion || 'Sin descripción.'}</p>
                                <div class="cuenta-info">
                                    <div><span>Esencia Azul:</span> <strong>${cuenta.esencia || '0'} EA</strong></div>
                                    <div><span>Nivel:</span> <strong>${cuenta.nivel || 'N/A'}</strong></div>
                                </div>
                            </div>
                            <button class="btn-submit" onclick="comprarCuenta('${doc.id}')">Comprar Cuenta</button>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch((error) => {
                    console.error("Error al obtener cuentas: ", error);
                    grid.innerHTML = '<p style="color: #f87171; font-size: 13px; grid-column: span 3; text-align: center; padding: 40px 0;">Error al conectar con la base de datos.</p>';
                });
        }

        function comprarCuenta(id) {
            alert("Iniciando compra para la cuenta ID: " + id);
        }

        actualizarBoost();
    </script>
</body>
</html>
