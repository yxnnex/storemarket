<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0 20px 0;
            border-bottom: 1px solid #1f2430;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #f8fafc;
        }

        header h1 span {
            color: #f3ba2f;
        }

        header p {
            color: #94a3b8;
            margin-top: 5px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* SISTEMA DE PESTAÑAS (TABS) */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: #12141c;
            border: 1px solid #1f2430;
            color: #94a3b8;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: #f3ba2f;
            color: #ffffff;
        }

        .tab-btn.active {
            background-color: #f3ba2f;
            color: #0b0e14;
            border-color: #f3ba2f;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f8fafc;
            border-left: 4px solid #f3ba2f;
            padding-left: 10px;
        }

        /* CUENTAS GRID */
        .grid-cuentas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .cuenta-card {
            background-color: #12141c;
            border: 1px solid #1f2430;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .cuenta-card:hover {
            transform: translateY(-4px);
            border-color: #f3ba2f;
        }

        .cuenta-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #1a1f2c;
        }

        .cuenta-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .cuenta-server {
            font-size: 0.75rem;
            background-color: #1a1f2c;
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .cuenta-titulo {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cuenta-detalles-info {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cuenta-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1f2430;
            padding-top: 12px;
        }

        .cuenta-precio {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f3ba2f;
        }

        .btn-comprar {
            background-color: #f3ba2f;
            color: #0b0e14;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-comprar:hover {
            background-color: #e0a822;
        }

        /* SECCIÓN DE ELO / CALCULADORA */
        .boost-section {
            background-color: #12141c;
            border: 1px solid #1f2430;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 50px;
        }

        .boost-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .boost-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #1a1f2c;
            border: 1px solid #2a3245;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #f3ba2f;
        }

        .boost-total {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f3ba2f;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-calcular {
            width: 100%;
            background-color: #f3ba2f;
            color: #0b0e14;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-calcular:hover {
            background-color: #e0a822;
        }

        /* VENTANA MODAL DE PAGO / COMPRA */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: #12141c;
            border: 1px solid #2a3245;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .modal-box h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: #f8fafc;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        .modal-info {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-pagar-paypal {
            width: 100%;
            background-color: #0070ba;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-pagar-paypal:hover {
            background-color: #005ea6;
        }

        .btn-pagar-alias {
            width: 100%;
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-pagar-alias:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>NEXUS <span>STORE</span></h1>
            <p>Cuentas smurf verificadas y servicio profesional</p>
        </header>

        <!-- PESTAÑAS DE NAVEGACIÓN -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-target="seccion-cuentas">⚔️ Cuentas Disponibles</button>
            <button class="tab-btn" data-target="seccion-boost">Boost</button>
        </div>

        <!-- SECCIÓN 1: CUENTAS -->
        <div id="seccion-cuentas" class="tab-content active">
            <h2 class="section-title">⚔️ Cuentas Disponibles</h2>
            <div id="grid-cuentas" class="grid-cuentas">
                <p style="color: #94a3b8;">Cargando catálogo...</p>
            </div>
        </div>

        <!-- SECCIÓN 2: ELO / CALCULADORA -->
        <div id="seccion-boost" class="tab-content">
            <div class="boost-section">
                <h2 class="section-title" style="margin-bottom: 15px; border-left-color: #38bdf8;">Boost</h2>
                <div class="boost-grid">
                    <div>
                        <div class="form-group">
                            <label>Selecciona tu elo</label>
                            <select id="liga-actual">
                                <option value="hierro">Hierro</option>
                                <option value="bronce">Bronce</option>
                                <option value="plata">Plata</option>
                                <option value="oro">Oro</option>
                                <option value="platino">Platino</option>
                                <option value="esmeralda">Esmeralda</option>
                                <option value="diamante">Diamante</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tus LP</label>
                            <select id="division-actual">
                                <option value="4">División IV (0-25 LP)</option>
                                <option value="3">División III (26-50 LP)</option>
                                <option value="2">División II (51-75 LP)</option>
                                <option value="1">División I (76-100 LP)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>Elo deseado</label>
                            <select id="liga-deseada">
                                <option value="hierro">Hierro</option>
                                <option value="bronce">Bronce</option>
                                <option value="plata">Plata</option>
                                <option value="oro">Oro</option>
                                <option value="platino">Platino</option>
                                <option value="esmeralda" selected>Esmeralda</option>
                                <option value="diamante">Diamante</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>División Deseada</label>
                            <select id="division-deseada">
                                <option value="4">División IV</option>
                                <option value="3">División III</option>
                                <option value="2">División II</option>
                                <option value="1">División I</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="boost-total">Estimado: <span id="precio-boost">USD $0</span></div>
                <button class="btn-calcular" id="btn-contratar-boost">Calcular / Contratar</button>
            </div>
        </div>
    </div>

    <!-- VENTANA MODAL DE PAGO -->
    <div id="modal-pago" class="modal-overlay">
        <div class="modal-box">
            <button id="modal-cerrar" class="modal-close">&times;</button>
            <h3 id="modal-titulo">Finalizar Compra</h3>
            <div id="modal-texto" class="modal-info"></div>
            
            <div class="form-group">
                <label>Tu Correo Electrónico (para enviarte los datos)</label>
                <input type="email" id="email-cliente" placeholder="tucorreo@gmail.com" required>
            </div>

            <div class="payment-options">
                <button id="btn-pagar-paypal" class="btn-pagar-paypal">💳 Pagar con PayPal</button>
                <button id="btn-pagar-alias" class="btn-pagar-alias">🏦 Pagar por Alias / Transferencia</button>
            </div>
        </div>
    </div>

    <!-- Script de Firebase y lógica de la tienda -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVGo2MoRA0cXgPMb7O3dVxDJVxG_iC1kQ",
            authDomain: "store-51d80.firebaseapp.com",
            projectId: "store-51d80",
            storageBucket: "store-51d80.firebasestorage.app",
            messagingSenderId: "695612329327",
            appId: "1:695612329327:web:298cea611bd736e3a36c9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lógica de Pestañas (Tabs)
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        const gridCuentas = document.getElementById('grid-cuentas');
        const modalPago = document.getElementById('modal-pago');
        const modalCerrar = document.getElementById('modal-cerrar');
        const modalTitulo = document.getElementById('modal-titulo');
        const modalTexto = document.getElementById('modal-texto');
        const btnPagarPaypal = document.getElementById('btn-pagar-paypal');
        const btnPagarAlias = document.getElementById('btn-pagar-alias');

        let itemSeleccionado = null;

        async function cargarCatalogo() {
            try {
                const querySnapshot = await getDocs(collection(db, "skin"));
                gridCuentas.innerHTML = "";

                if (querySnapshot.empty) {
                    gridCuentas.innerHTML = "<p style='color: #94a3b8;'>No hay cuentas cargadas por el momento.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const c = docSnap.data();
                    const card = document.createElement('div');
                    card.className = 'cuenta-card';
                    card.innerHTML = `
                        <img src="${c.imageUrl || 'https://via.placeholder.com/300x160'}" class="cuenta-img" alt="Cuenta">
                        <div class="cuenta-body">
                            <div>
                                <span class="cuenta-server">${c.server || 'LAS'}</span>
                                <h3 class="cuenta-titulo">${c.title || 'Cuenta Smurf'}</h3>
                                <div class="cuenta-detalles-info">
                                    <span>⚔️ Campeones: ${c.championCount || 'N/A'}</span>
                                    <span>🏆 Rango: ${c.currentRank || 'Unranked'}</span>
                                    <span>💎 EA: ${c.riotPoints || '0'}</span>
                                </div>
                            </div>
                            <div class="cuenta-footer">
                                <span class="cuenta-precio">USD $${c.price || '0'}</span>
                                <button class="btn-comprar">Comprar</button>
                            </div>
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        itemSeleccionado = {
                            tipo: 'cuenta',
                            titulo: c.title,
                            precio: c.price
                        };
                        modalTitulo.textContent = "🛒 Comprar Cuenta";
                        modalTexto.innerHTML = `Estás a un paso de adquirir: <b>${c.title}</b>.<br>Precio final: <b style="color: #f3ba2f;">USD $${c.price}</b>`;
                        modalPago.classList.add('active');
                    });

                    gridCuentas.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                gridCuentas.innerHTML = "<p style='color: #ef4444;'>Error al cargar las cuentas desde la base de datos.</p>";
            }
        }

        // Lógica de cálculo de elos en dólares
        const selectLigaActual = document.getElementById('liga-actual');
        const selectDivActual = document.getElementById('division-actual');
        const selectLigaDeseada = document.getElementById('liga-deseada');
        const selectDivDeseada = document.getElementById('division-deseada');
        const spanPrecioBoost = document.getElementById('precio-boost');
        const btnContratarBoost = document.getElementById('btn-contratar-boost');

        const valoresLigas = { hierro: 1, bronce: 2, plata: 3, oro: 4, platino: 5, esmeralda: 6, diamante: 7 };

        function calcularElo() {
            const lAct = valoresLigas[selectLigaActual.value];
            const dAct = parseInt(selectDivActual.value);
            const lDes = valoresLigas[selectLigaDeseada.value];
            const dDes = parseInt(selectDivDeseada.value);

            const scoreActual = (lAct * 4) + (5 - dAct);
            const scoreDeseado = (lDes * 4) + (5 - dDes);
            const diff = scoreDeseado - scoreActual;

            let precio = diff > 0 ? diff * 3.5 : 0;
            spanPrecioBoost.textContent = `USD $${precio.toFixed(2)}`;
            return precio;
        }

        [selectLigaActual, selectDivActual, selectLigaDeseada, selectDivDeseada].forEach(sel => {
            sel.addEventListener('change', calcularElo);
        });

        calcularElo();

        btnContratarBoost.addEventListener('click', () => {
            const precio = calcularElo();
            if (precio <= 0) {
                alert("El elo deseado debe ser mayor al actual.");
                return;
            }
            itemSeleccionado = {
                tipo: 'elo',
                titulo: `Subida de Elo de ${selectLigaActual.value} (Div. ${selectDivActual.value}) a ${selectLigaDeseada.value} (Div. ${selectDivDeseada.value})`,
                precio: precio.toFixed(2)
            };
            modalTitulo.textContent = "📊 Contratar Servicio de Elos";
            modalTexto.innerHTML = `Servicio: <b>${itemSeleccionado.titulo}</b>.<br>Total a abonar: <b style="color: #f3ba2f;">USD $${itemSeleccionado.precio}</b>`;
            modalPago.classList.add('active');
        });

        // Cerrar Modal
        modalCerrar.addEventListener('click', () => {
            modalPago.classList.remove('active');
        });

        modalPago.addEventListener('click', (e) => {
            if (e.target === modalPago) {
                modalPago.classList.remove('active');
            }
        });

        // Botón Pago PayPal
        btnPagarPaypal.addEventListener('click', () => {
            const email = document.getElementById('email-cliente').value;
            if (!email) {
                alert("Por favor ingresa tu correo electrónico.");
                return;
            }
            alert(`Redirigiendo a PayPal para ${itemSeleccionado.titulo} (USD $${itemSeleccionado.precio}) - Correo: ${email}`);
            modalPago.classList.remove('active');
        });

        // Botón Pago Alias / Transferencia
        btnPagarAlias.addEventListener('click', () => {
            const email = document.getElementById('email-cliente').value;
            if (!email) {
                alert("Por favor ingresa tu correo electrónico.");
                return;
            }
            alert(`Instrucciones de pago por Alias/Transferencia para ${itemSeleccionado.titulo} (USD $${itemSeleccionado.precio}) enviadas a: ${email}`);
            modalPago.classList.remove('active');
        });

        cargarCatalogo();
    </script>
</body>
</html>
