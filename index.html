<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda & Boosting</title>
    <!-- Tus estilos originales se mantienen intactos -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0d0f18;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, #9333ea, #4f46e5);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-cuentas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .cuenta-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .cuenta-card:hover {
            transform: translateY(-5px);
            border-color: rgba(192, 132, 252, 0.4);
        }

        .cuenta-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #111827;
        }

        .cuenta-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .cuenta-server {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a78bfa;
            font-weight: 700;
        }

        .cuenta-titulo {
            font-size: 1.1rem;
            margin: 0.4rem 0;
            font-weight: 700;
        }

        .cuenta-detalles-info {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cuenta-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.8rem;
        }

        .cuenta-precio {
            font-size: 1.25rem;
            font-weight: 800;
            color: #34d399;
        }

        .btn-comprar {
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-comprar:hover {
            background: #6366f1;
        }

        .boost-container {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .boost-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .mode-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #9333ea;
            border-color: #c084fc;
            color: #fff;
        }

        .boost-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media(max-width: 768px) {
            .boost-grid { grid-template-columns: 1fr; }
        }

        .boost-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .boost-box img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .form-group select, .form-group input {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .option-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .promo-banner {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(192, 132, 252, 0.3);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: #e9d5ff;
            display: none;
            text-align: center;
        }

        .boost-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }

        .boost-price {
            font-size: 2rem;
            font-weight: 800;
            color: #34d399;
        }

        .btn-contratar {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-contratar.promo-active {
            background: linear-gradient(135deg, #9333ea, #ec4899);
        }

        .btn-contratar:hover {
            transform: scale(1.02);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            border-radius: 16px;
            position: relative;
        }

        .modal-box h3 { margin-bottom: 1rem; }
        .modal-close {
            position: absolute;
            top: 1rem; right: 1rem;
            background: transparent; border: none;
            color: #94a3b8; font-size: 1.2rem; cursor: pointer;
        }
        .modal-actions {
            display: flex; gap: 10px; margin-top: 1.5rem;
        }
        .modal-actions button {
            flex: 1; padding: 0.7rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;
        }
        .btn-whatsapp { background: #25d366; color: #fff; }
        .btn-paypal { background: #0070ba; color: #fff; }

        .custom-alert {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .custom-alert.active {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-alert-box {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 90%;
            max-width: 350px;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .custom-alert-box p {
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        .custom-alert-box button {
            background: #9333ea;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>

        <div class="nav-tabs">

                <div id="promo-banner" class="promo-banner"></div>

                <div class="options-grid">

                <div class="boost-summary">

    <!-- Modal de Pago / Checkout -->

    <!-- Alerta Personalizada Modal -->
    <div id="customAlert" class="custom-alert">
        <div class="custom-alert-box">

            <button onclick="cerrarAlertaCustom()">Entendido</button>
        </div>
    </div>

    <!-- Lógica de la página con sincronización dinámica de Firebase para las tarifas -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.color = Math.random() > 0.5 ? 'rgba(168, 85, 247, 0.35)' : 'rgba(79, 70, 229, 0.3)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            const numberOfParticles = Math.floor((canvas.width * canvas.height) / 15000);
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        const firebaseConfig = {
            apiKey: "AIzaSyAVGo2MoRA0cXgPMb7O3dVxDJVxG_iC1kQ",
            authDomain: "store-51d80.firebaseapp.com",
            projectId: "store-51d80",
            storageBucket: "store-51d80.firebasestorage.app",
            messagingSenderId: "695612329327",
            appId: "1:695612329327:web:298cea611bd736e3a36c9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.mostrarAlerta = function(mensaje) {
            document.getElementById('customAlertMessage').innerText = mensaje;
            document.getElementById('customAlert').classList.add('active');
        }

        window.cerrarAlertaCustom = function() {
            document.getElementById('customAlert').classList.remove('active');
        }

        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        const modeBtns = document.querySelectorAll('.mode-btn');
        let modoSeleccionado = 'solo';
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                modoSeleccionado = btn.getAttribute('data-mode');
                actualizarBoost();
            });
        });

        const rangosEmblemas = {
            Hierro: "Hierro.png",
            Bronce: "Bronce.png",
            Plata: "Plata.png",
            Oro: "Oro.png",
            Platino: "Platino.png",
            Esmeralda: "Esmeralda.png",
            Diamante: "Diamante.png",
            Maestro: "Maestro.png"
        };

        const ligasOrden = ["Hierro", "Bronce", "Plata", "Oro", "Platino", "Esmeralda", "Diamante", "Maestro"];

        const ligaActual = document.getElementById('liga-actual');
        const divActual = document.getElementById('division-actual');
        const lpActual = document.getElementById('lp-actual');
        const lpGanancia = document.getElementById('lp-ganancia');
        
        const ligaDeseada = document.getElementById('liga-deseada');
        const divDeseada = document.getElementById('division-deseada');
        const lpDeseado = document.getElementById('lp-deseado');
        
        const imgActual = document.getElementById('img-actual');
        const txtActual = document.getElementById('txt-actual');
        const imgDeseado = document.getElementById('img-deseado');
        const txtDeseado = document.getElementById('txt-deseado');
        const precioBoost = document.getElementById('precio-boost');
        const promoBanner = document.getElementById('promo-banner');
        const btnContratar = document.getElementById('btn-contratar-boost');

        const valoresLigas = { Hierro: 1, Bronce: 2, Plata: 3, Oro: 4, Platino: 5, Esmeralda: 6, Diamante: 7, Maestro: 8 };

        // Tarifas por defecto conectadas dinámicamente a Firebase
        let tarifasFirebase = {
            baja: 4.00,
            media: 6.50,
            alta: 12.00,
            multiplicadorLpBajo: 1.20
        };

        async function cargarTarifasTienda() {
            try {
                const docRef = doc(db, "configuracion", "tarifasBoost");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    tarifasFirebase.baja = data.baja ?? 4.00;
                    tarifasFirebase.media = data.media ?? 6.50;
                    tarifasFirebase.alta = data.alta ?? 12.00;
                    tarifasFirebase.multiplicadorLpBajo = data.multiplicadorLpBajo ?? 1.20;
                }
            } catch (err) {
                console.error("Error al cargar tarifas:", err);
            }
            actualizarBoost();
        }

        function actualizarBoost() {
            const lAct = ligaActual.value;
            const dAct = divActual.value;
            const lDes = ligaDeseada.value;
            const dDes = divDeseada.value;

            imgActual.src = rangosEmblemas[lAct] || "Hierro.png";
            txtActual.textContent = `${lAct} Div. ${dAct}`;

            imgDeseado.src = rangosEmblemas[lDes] || "Hierro.png";
            txtDeseado.textContent = `${lDes} Div. ${dDes}`;

            const scoreActual = (valoresLigas[lAct] * 4) + (5 - parseInt(dAct));
            const scoreDeseado = (valoresLigas[lDes] * 4) + (5 - parseInt(dDes));
            const diff = scoreDeseado - scoreActual;

            let tarifaPorDivision = tarifasFirebase.baja;
            if (lAct === "Platino" || lAct === "Esmeralda") tarifaPorDivision = tarifasFirebase.media;
            if (lAct === "Diamante" || lAct === "Maestro") tarifaPorDivision = tarifasFirebase.alta;

            let precioDivisiones = diff > 0 ? diff * tarifaPorDivision : 0;

            const multiplicadorLp = {
                '17-19': tarifasFirebase.multiplicadorLpBajo,
                '20-25': 1.00,
                '25-30': 0.90
            };
            let precio = precioDivisiones * (multiplicadorLp[lpGanancia.value] || 1.0);

            let esLigaCompleta = (lAct === lDes && dAct === "4" && dDes === "1");

            if (esLigaCompleta) {
                let porcentajeDescuento = 0.05;
                if (lAct === "Plata" || lAct === "Oro") porcentajeDescuento = 0.08;
                if (lAct === "Platino" || lAct === "Esmeralda") porcentajeDescuento = 0.12;
                if (lAct === "Diamante") porcentajeDescuento = 0.15;

                let descuentoMonto = (lAct === "Hierro") ? 2.00 : (precio * porcentajeDescuento);
                precio -= descuentoMonto;

                let indexLigaActual = ligasOrden.indexOf(lAct);
                let siguienteLiga = ligasOrden[indexLigaActual + 1] || "la siguiente liga";

                promoBanner.innerHTML = `🚀 <b>¡OFERTA LIGA COMPLETA!</b><br>Estás contratando un impulso en la misma liga, ¡a un paso de <b>${siguienteLiga}</b>! ⭐Sabías que si contratas el servicio hasta <b>${siguienteLiga}</b> ¡Obtienes un descuento especial! Aprovechalo, Salta al siguiente nivel!`;
                promoBanner.style.display = "block";
                
                btnContratar.classList.add('promo-active');
                btnContratar.textContent = `¡Aprovechar Oferta de ${lAct}!`;
            } else {
                promoBanner.style.display = "none";
                btnContratar.classList.remove('promo-active');
                btnContratar.textContent = "Obtener oferta";
            }

            if (modoSeleccionado === 'duo') precio *= 1.3;
            if (document.getElementById('chk-streaming').checked) precio += 5;
            if (document.getElementById('chk-offline').checked) precio += 3;

            precioBoost.textContent = precio > 0 ? precio.toFixed(2) : "0.00";
            return precio > 0 ? precio : 0;
        }

        [ligaActual, divActual, lpActual, lpGanancia, ligaDeseada, divDeseada, lpDeseado, document.getElementById('chk-streaming'), document.getElementById('chk-offline')].forEach(el => {
            el.addEventListener('change', actualizarBoost);
            el.addEventListener('input', actualizarBoost);
        });

        const modalPago = document.getElementById('modal-pago');
        const modalTexto = document.getElementById('modal-texto');
        const grupoEmail = document.getElementById('grupo-email');
        const grupoBoostCampos = document.getElementById('grupo-boost-campos');
        let itemSeleccionado = null;
        let tipoItemActual = '';

        document.getElementById('btn-contratar-boost').addEventListener('click', () => {
            const precio = actualizarBoost();
            if (precio <= 0) {
                mostrarAlerta("El rango deseado debe ser mayor al actual.");
                return;
            }
            tipoItemActual = 'boost';
            itemSeleccionado = {
                titulo: `Boost (${modoSeleccionado.toUpperCase()}) de ${ligaActual.value} Div.${divActual.value} a ${ligaDeseada.value} Div.${divDeseada.value} [${lpGanancia.value} LP]`,
                precio: precio.toFixed(2)
            };
            
            grupoEmail.style.display = 'none';
            grupoBoostCampos.style.display = 'block';

            modalTexto.innerHTML = `Servicio: <b>${itemSeleccionado.titulo}</b><br>Total con descuento: <b style="color: #c084fc;">USD $${itemSeleccionado.precio}</b>`;
            document.getElementById('chk-terminos').checked = false;
            modalPago.classList.add('active');
        });

        document.getElementById('modal-cerrar').addEventListener('click', () => modalPago.classList.remove('active'));

        document.getElementById('btn-pagar-alias').addEventListener('click', async () => {
            const aceptaTerminos = document.getElementById('chk-terminos').checked;
            if(!aceptaTerminos) { mostrarAlerta("Debes aceptar los Términos y Condiciones de no reembolso."); return; }

            const tuNumeroWhatsApp = "59899806108"; 
            let mensaje = "";

            if (tipoItemActual === 'boost') {
                const lolId = document.getElementById('input-lol-id').value;
                const discordUser = document.getElementById('input-discord-user').value;

                if(!lolId || !discordUser) {
                    mostrarAlerta("Por favor ingresa tu ID de LoL y tu usuario de Discord.");
                    return;
                }

                mensaje = `Hola! Quiero contratar el servicio: ${itemSeleccionado.titulo} por USD $${itemSeleccionado.precio}. Mi ID de LoL es: ${lolId} (Acepté los términos de no reembolso). Mi user de discord es ${discordUser}.`;
                
                try {
                    await addDoc(collection(db, "pedidosBoost"), {
                        tipo: "Boost",
                        clienteDiscord: `${discordUser} (LoL: ${lolId})`,
                        detalle: itemSeleccionado.titulo,
                        monto: `USD $${itemSeleccionado.precio}`,
                        fecha: new Date().toISOString()
                    });
                } catch(e) { console.error(e); }

            } else {
                const email = document.getElementById('email-cliente').value;
                if(!email) { mostrarAlerta("Ingresa tu correo electrónico"); return; }

                mensaje = `Hola! Quiero comprar la cuenta: ${itemSeleccionado.titulo} por USD $${itemSeleccionado.precio}. Mi correo es: ${email} (Acepté los términos de no reembolso).`;
                
                try {
                    await addDoc(collection(db, "compras"), {
                        tipo: "Cuenta",
                        clienteDiscord: email,
                        detalle: itemSeleccionado.titulo,
                        monto: `USD $${itemSeleccionado.precio}`,
                        fecha: new Date().toISOString()
                    });
                } catch(e) { console.error(e); }
            }
            
            window.open(`https://wa.me/${tuNumeroWhatsApp}?text=${encodeURIComponent(mensaje)}`, '_blank');
            modalPago.classList.remove('active');
        });

        document.getElementById('btn-pagar-paypal').addEventListener('click', async () => {
            const aceptaTerminos = document.getElementById('chk-terminos').checked;
            if(!aceptaTerminos) {
                mostrarAlerta("Debes aceptar los Términos y Condiciones para continuar.");
                return;
            }

            if (tipoItemActual === 'boost') {
                const lolId = document.getElementById('input-lol-id').value;
                const discordUser = document.getElementById('input-discord-user').value;

                if(!lolId || !discordUser) {
                    mostrarAlerta("Por favor ingresa tu ID de LoL y tu usuario de Discord.");
                    return;
                }

                try {
                    await addDoc(collection(db, "pedidosBoost"), {
                        tipo: "Boost",
                        clienteDiscord: `${discordUser} (LoL: ${lolId})`,
                        detalle: itemSeleccionado.titulo,
                        monto: `USD $${itemSeleccionado.precio}`,
                        fecha: new Date().toISOString()
                    });
                } catch(e) { console.error(e); }

            } else {
                const email = document.getElementById('email-cliente').value;
                if(!email) { 
                    mostrarAlerta("Ingresa tu correo electrónico antes de continuar."); 
                    return; 
                }

                try {
                    await addDoc(collection(db, "compras"), {
                        tipo: "Cuenta",
                        clienteDiscord: email,
                        detalle: itemSeleccionado.titulo,
                        monto: `USD $${itemSeleccionado.precio}`,
                        fecha: new Date().toISOString()
                    });
                } catch(e) { console.error(e); }
            }
            
            const monto = itemSeleccionado.precio;
            const urlPayPal = `https://paypal.me/agustinportii/${monto}USD`;
            
            window.open(urlPayPal, '_blank');
            modalPago.classList.remove('active');
        });

        async function cargarCatalogo() {
            const grid = document.getElementById('grid-cuentas');
            try {
                const snapshot = await getDocs(collection(db, "skin"));
                grid.innerHTML = "";
                if(snapshot.empty) { grid.innerHTML = "<p style='color: #a78bfa;'>No hay cuentas cargadas.</p>"; return; }
                
                snapshot.forEach(doc => {
                    const c = doc.data();
                    const card = document.createElement('div');
                    card.className = 'cuenta-card';
                    card.innerHTML = `
                        <img src="${c.imageUrl}" class="cuenta-img" alt="Cuenta">
                        <div class="cuenta-body">
                            <div>
                                <span class="cuenta-server">${c.server}</span>
                                <h3 class="cuenta-titulo">${c.title}</h3>
                                <div class="cuenta-detalles-info">
                                    <span>⚔️ Campeones: ${c.championCount}</span>
                                    <span>🏆 Rango: ${c.currentRank}</span>
                                    <span>💎 EA: ${c.riotPoints}</span>
                                </div>
                            </div>
                            <div class="cuenta-footer">
                                <span class="cuenta-precio">USD $${c.price}</span>
                                <button class="btn-comprar">Comprar</button>
                            </div>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        tipoItemActual = 'cuenta';
                        itemSeleccionado = { titulo: c.title, precio: c.price };
                        
                        grupoEmail.style.display = 'block';
                        grupoBoostCampos.style.display = 'none';

                        modalTexto.innerHTML = `Compra: <b>${c.title}</b><br>Precio: <b style="color: #c084fc;">USD $${c.price}</b>`;
                        document.getElementById('chk-terminos').checked = false;
                        modalPago.classList.add('active');
                    });
                    grid.appendChild(card);
                });
            } catch(e) { console.error(e); }
        }

        cargarTarifasTienda();
        cargarCatalogo();
    </script>
</body>
</html>
