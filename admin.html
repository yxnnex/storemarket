<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - Panel Admin Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #07090e;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(18, 20, 28, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            margin-bottom: 30px;
        }

        h1 span { color: #f3ba2f; }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .admin-grid { grid-template-columns: 1fr; }
        }

        .admin-box {
            background: rgba(18, 20, 28, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .admin-box-full {
            background: rgba(18, 20, 28, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .admin-box h2, .admin-box-full h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #22c55e;
            border-left: 4px solid #22c55e;
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: rgba(11, 14, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #f3ba2f;
        }

        .btn-subir {
            width: 100%;
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-subir:hover { background-color: #16a34a; }

        .btn-volver {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .btn-volver:hover { background: rgba(255, 255, 255, 0.15); }

        /* Estilos de la tabla de servicios contratados */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        th {
            color: #94a3b8;
            font-weight: 600;
        }

        td {
            color: #e2e8f0;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-cuenta { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-boost { background: rgba(243, 186, 47, 0.15); color: #f3ba2f; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>NEXUS <span>ADMIN</span></h1>
            <a href="index.html" class="btn-volver">Ver Tienda ➔</a>
        </header>

        <div class="admin-grid">
            <!-- CAJA 1: SUBIR CUENTA -->
            <div class="admin-box">
                <h2>Publicar Cuenta</h2>
                <form id="form-subir-cuenta">
                    <div class="form-group"><label>Título</label><input type="text" id="admin-titulo" required></div>
                    <div class="form-group"><label>Servidor</label><select id="admin-server"><option value="LAS">LAS</option><option value="LAN">LAN</option><option value="NA">NA</option></select></div>
                    <div class="form-group"><label>Campeones</label><input type="text" id="admin-campeones" required></div>
                    <div class="form-group"><label>Rango Actual</label><input type="text" id="admin-rango" required></div>
                    <div class="form-group"><label>EA (Esencia Azul)</label><input type="text" id="admin-ea" required></div>
                    <div class="form-group"><label>Precio USD</label><input type="number" step="0.01" id="admin-precio" required></div>
                    <div class="form-group"><label>URL de Imagen</label><input type="url" id="admin-imagen" required></div>
                    <button type="submit" class="btn-subir">Publicar Cuenta</button>
                </form>
            </div>

            <!-- CAJA 2: CONFIGURAR PRECIOS DE BOOST -->
            <div class="admin-box">
                <h2>Tarifas de Boost</h2>
                <form id="form-guardar-tarifas">
                    <div class="form-group">
                        <label>Tarifa Base por División (Hierro a Oro)</label>
                        <input type="number" step="0.5" id="tarifa-baja" value="4.00" required>
                    </div>
                    <div class="form-group">
                        <label>Tarifa Base por División (Platino a Esmeralda)</label>
                        <input type="number" step="0.5" id="tarifa-media" value="6.50" required>
                    </div>
                    <div class="form-group">
                        <label>Tarifa Base por División (Diamante a Maestro+)</label>
                        <input type="number" step="0.5" id="tarifa-alta" value="12.00" required>
                    </div>
                    <div class="form-group">
                        <label>Recargo por LP Bajo (17-19 LP)</label>
                        <input type="number" step="0.05" id="recargo-lp" value="1.20" required>
                    </div>
                    <button type="submit" class="btn-subir" style="background-color: #f3ba2f; color: #0b0e14;">Guardar Tarifas</button>
                </form>
            </div>
        </div>

        <!-- CAJA 3: SERVICIOS CONTRATADOS (PARA CORROBORAR COMPROBANTES) -->
        <div class="admin-box-full">
            <h2>Servicios Contratados (Para Corroborar Comprobantes)</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Cliente / Discord</th>
                            <th>Detalle del Servicio</th>
                            <th>Monto</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-servicios">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #94a3b8;">Cargando servicios contratados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA ADMIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVGo2MoRA0cXgPMb7O3dVxDJVxG_iC1kQ",
            authDomain: "store-51d80.firebaseapp.com",
            projectId: "store-51d80",
            storageBucket: "store-51d80.firebasestorage.app",
            messagingSenderId: "695612329327",
            appId: "1:695612329327:web:298cea611bd736e3a36c9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Subir cuenta nueva
        document.getElementById('form-subir-cuenta').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const nueva = {
                    title: document.getElementById('admin-titulo').value,
                    server: document.getElementById('admin-server').value,
                    championCount: document.getElementById('admin-campeones').value,
                    currentRank: document.getElementById('admin-rango').value,
                    riotPoints: document.getElementById('admin-ea').value,
                    price: parseFloat(document.getElementById('admin-precio').value),
                    imageUrl: document.getElementById('admin-imagen').value
                };
                await addDoc(collection(db, "skin"), nueva);
                alert("¡Cuenta publicada con éxito!");
                e.target.reset();
            } catch (err) {
                console.error(err);
                alert("Error al publicar la cuenta.");
            }
        });

        // Guardar tarifas de boost en Firebase
        document.getElementById('form-guardar-tarifas').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const tarifas = {
                    baja: parseFloat(document.getElementById('tarifa-baja').value),
                    media: parseFloat(document.getElementById('tarifa-media').value),
                    alta: parseFloat(document.getElementById('tarifa-alta').value),
                    multiplicadorLpBajo: parseFloat(document.getElementById('recargo-lp').value)
                };
                await setDoc(doc(db, "configuracion", "tarifasBoost"), tarifas);
                alert("¡Tarifas de Boost actualizadas correctamente!");
            } catch (err) {
                console.error(err);
                alert("Error al guardar las tarifas.");
            }
        });

        // Cargar Servicios Contratados (Venta de cuentas y Boosts) desde Firestore
        async function cargarServiciosContratados() {
            const tabla = document.getElementById('tabla-servicios');
            let htmlContenido = "";

            try {
                // 1. Consultar compras de cuentas
                const snapshotCuentas = await getDocs(collection(db, "compras")).catch(() => ({ empty: true }));
                
                if (!snapshotCuentas.empty) {
                    snapshotCuentas.forEach((docSnap) => {
                        const data = docSnap.data();
                        const cliente = data.clienteDiscord || data.discord || data.usuario || "Cliente";
                        const detalle = data.detalle || "Compra de Cuenta LoL";
                        const monto = data.monto || (data.precio ? `USD $${data.precio}` : "N/D");

                        htmlContenido += `
                            <tr>
                                <td><span class="badge badge-cuenta">Cuenta</span></td>
                                <td>${cliente}</td>
                                <td>${detalle}</td>
                                <td>${monto}</td>
                            </tr>
                        `;
                    });
                }

                // 2. Consultar servicios de Boost
                const snapshotBoosts = await getDocs(collection(db, "pedidosBoost")).catch(() => ({ empty: true }));

                if (!snapshotBoosts.empty) {
                    snapshotBoosts.forEach((docSnap) => {
                        const data = docSnap.data();
                        const cliente = data.clienteDiscord || data.discord || data.usuario || "Cliente";
                        const detalle = data.detalle || "Servicio de Boost";
                        const monto = data.monto || "N/D";

                        htmlContenido += `
                            <tr>
                                <td><span class="badge badge-boost">Boost</span></td>
                                <td>${cliente}</td>
                                <td>${detalle}</td>
                                <td>${monto}</td>
                            </tr>
                        `;
                    });
                }

                // Si no hay nada en ninguna de las dos colecciones
                if (htmlContenido === "") {
                    tabla.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8;">No hay servicios contratados registrados todavía.</td></tr>`;
                } else {
                    tabla.innerHTML = htmlContenido;
                }

            } catch (err) {
                console.error("Error al cargar los servicios:", err);
                tabla.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ef4444;">Error al conectar con la base de datos para los registros.</td></tr>`;
            }
        }

        // Ejecutar al cargar el panel
        window.addEventListener('DOMContentLoaded', cargarServiciosContratados);
    </script>
</body>
</html>
