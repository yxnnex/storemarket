<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - Panel Protegido</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-container {
            background-color: #12141c;
            border: 1px solid #1f2430;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #f8fafc;
            text-align: center;
        }

        h2 span {
            color: #f3ba2f;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #1a1f2c;
            border: 1px solid #2a3245;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #f3ba2f;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #f3ba2f;
            color: #0b0e14;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #e0a822;
        }

        .btn-secundario {
            background-color: #334155;
            color: #ffffff;
            margin-top: 5px;
        }
        .btn-secundario:hover {
            background-color: #475569;
        }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-bottom: 1px solid #1f2430;
            padding-bottom: 10px;
        }

        .btn-logout {
            background-color: #ef4444;
            color: white;
            width: auto;
            padding: 6px 12px;
            margin: 0;
            font-size: 0.8rem;
        }
        .btn-logout:hover {
            background-color: #dc2626;
        }

        /* LISTADO DE CUENTAS EN ADMIN */
        .lista-admin {
            margin-top: 30px;
            border-top: 1px solid #1f2430;
            padding-top: 20px;
        }

        .item-cuenta-admin {
            background-color: #1a1f2c;
            border: 1px solid #2a3245;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info h4 {
            font-size: 0.95rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .item-info p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .item-acciones {
            display: flex;
            gap: 8px;
        }

        .btn-accion {
            padding: 6px 10px;
            font-size: 0.75rem;
            width: auto;
            margin: 0;
        }

        .btn-editar {
            background-color: #38bdf8;
            color: #0b0e14;
        }

        .btn-eliminar {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- SECCIÓN DE LOGIN -->
        <div id="seccion-login">
            <h2>🔐 ACCESO <span>ADMIN</span></h2>
            <form id="form-login">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="tu-correo@admin.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-login">Ingresar al Panel</button>
            </form>
            <div id="mensaje-login" class="mensaje" style="color: #ef4444;"></div>
        </div>

        <!-- SECCIÓN DEL PANEL -->
        <div id="seccion-panel" class="hidden">
            <div class="user-info">
                <span id="user-email-display"></span>
                <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
            </div>

            <h2 id="titulo-modo">⚡ GESTIONAR <span>CUENTA</span></h2>
            
            <form id="form-cuenta">
                <!-- Campo oculto para saber si estamos editando un ID existente -->
                <input type="hidden" id="cuenta-id">

                <div class="form-group">
                    <label>Servidor</label>
                    <select id="server" required>
                        <option value="LAS">LAS (Latinoamérica Sur)</option>
                        <option value="LAN">LAN (Latinoamérica Norte)</option>
                        <option value="NA">NA (North America)</option>
                        <option value="EUW">EUW (Europe West)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>URL de la Imagen (Ej: Imgur o enlace directo)</label>
                    <input type="url" id="imageUrl" placeholder="https://i.imgur.com/tu-imagen.jpg" required>
                </div>

                <div class="form-group">
                    <label>Cantidad de Campeones</label>
                    <input type="text" id="championCount" placeholder="Ej: 30 campeones" required>
                </div>

                <div class="form-group">
                    <label>Rango Actual</label>
                    <input type="text" id="currentRank" placeholder="Ej: Platino IV / Unranked" required>
                </div>

                <div class="form-group">
                    <label>Escencia Azul</label>
                    <input type="text" id="riotPoints" placeholder="Ej: 2000 RP" required>
                </div>

                <div class="form-group">
                    <label>Título de la Cuenta</label>
                    <input type="text" id="title" placeholder="Ej: Cuenta Smurf Nivel 30 - Yone Main" required>
                </div>

                <div class="form-group">
                    <label>Precio en USD (Ej: 15.50)</label>
                    <input type="number" step="0.01" id="price" placeholder="Ej: 15" required>
                </div>

                <button type="submit" id="btn-publicar">Publicar Cuenta Nueva</button>
                <button type="button" id="btn-cancelar-edicion" class="btn-secundario hidden">Cancelar Edición</button>
            </form>

            <div id="mensaje-estado" class="mensaje"></div>

            <!-- LISTADO DE CUENTAS PARA EDITAR / BORRAR -->
            <div class="lista-admin">
                <h3 style="font-size: 1.1rem; margin-bottom: 15px; color: #f8fafc;">📋 Cuentas Existentes (Editar / Borrar)</h3>
                <div id="contenedor-cuentas-admin">
                    <p style="color: #94a3b8; font-size: 0.85rem;">Cargando listado...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de autenticación, CRUD y lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVGo2MoRA0cXgPMb7O3dVxDJVxG_iC1kQ",
            authDomain: "store-51d80.firebaseapp.com",
            projectId: "store-51d80",
            storageBucket: "store-51d80.firebasestorage.app",
            messagingSenderId: "695612329327",
            appId: "1:695612329327:web:298cea611bd736e3a36c9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const seccionLogin = document.getElementById('seccion-login');
        const seccionPanel = document.getElementById('seccion-panel');
        const formLogin = document.getElementById('form-login');
        const mensajeLogin = document.getElementById('mensaje-login');
        const userEmailDisplay = document.getElementById('user-email-display');
        const btnLogout = document.getElementById('btn-logout');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                seccionLogin.classList.add('hidden');
                seccionPanel.classList.remove('hidden');
                userEmailDisplay.textContent = `Admin: ${user.email}`;
                cargarCuentasAdmin();
            } else {
                seccionPanel.classList.add('hidden');
                seccionLogin.classList.remove('hidden');
            }
        });

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            mensajeLogin.textContent = "";

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error(error);
                mensajeLogin.textContent = "Credenciales incorrectas o usuario no registrado.";
            }
        });

        btnLogout.addEventListener('click', async () => {
            await signOut(auth);
        });

        const formCuenta = document.getElementById('form-cuenta');
        const mensajeEstado = document.getElementById('mensaje-estado');
        const cuentaIdInput = document.getElementById('cuenta-id');
        const btnPublicar = document.getElementById('btn-publicar');
        const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion');
        const tituloModo = document.getElementById('titulo-modo');
        const contenedorCuentasAdmin = document.getElementById('contenedor-cuentas-admin');

        // Función para listar las cuentas en el panel admin y permitir editarlas o borrarlas
        async function cargarCuentasAdmin() {
            try {
                const querySnapshot = await getDocs(collection(db, "skin"));
                contenedorCuentasAdmin.innerHTML = "";

                if (querySnapshot.empty) {
                    contenedorCuentasAdmin.innerHTML = "<p style='color: #94a3b8; font-size: 0.85rem;'>No hay cuentas cargadas.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const c = docSnap.data();
                    const id = docSnap.id;

                    const div = document.createElement('div');
                    div.className = 'item-cuenta-admin';
                    div.innerHTML = `
                        <div class="item-info">
                            <h4>${c.title || 'Sin título'}</h4>
                            <p>${c.server} | Rango: ${c.currentRank} | USD $${c.price}</p>
                        </div>
                        <div class="item-acciones">
                            <button type="button" class="btn-accion btn-editar" data-id="${id}">Editar</button>
                            <button type="button" class="btn-accion btn-eliminar" data-id="${id}">Borrar</button>
                        </div>
                    `;
                    contenedorCuentasAdmin.appendChild(div);
                });

                // Asignar eventos a los botones de Editar
                document.querySelectorAll('.btn-editar').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        const querySnapshot = await getDocs(collection(db, "skin"));
                        querySnapshot.forEach((docSnap) => {
                            if (docSnap.id === id) {
                                const c = docSnap.data();
                                cuentaIdInput.value = id;
                                document.getElementById('server').value = c.server || 'LAS';
                                document.getElementById('imageUrl').value = c.imageUrl || '';
                                document.getElementById('championCount').value = c.championCount || '';
                                document.getElementById('currentRank').value = c.currentRank || '';
                                document.getElementById('riotPoints').value = c.riotPoints || '';
                                document.getElementById('title').value = c.title || '';
                                document.getElementById('price').value = c.price || '';

                                btnPublicar.textContent = "Guardar Cambios";
                                tituloModo.innerHTML = "✏️ EDITAR <span>CUENTA</span>";
                                btnCancelarEdicion.classList.remove('hidden');
                                window.scrollTo({ top: 0, behavior: 'smooth' });
                            }
                        });
                    });
                });

                // Asignar eventos a los botones de Eliminar
                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm("¿Estás segura de que querés eliminar esta cuenta?")) {
                            try {
                                await deleteDoc(doc(db, "skin", id));
                                cargarCuentasAdmin();
                                mensajeEstado.style.color = "#38bdf8";
                                mensajeEstado.textContent = "Cuenta eliminada correctamente.";
                            } catch (err) {
                                console.error(err);
                                alert("Error al eliminar la cuenta.");
                            }
                        }
                    });
                });

            } catch (error) {
                console.error(error);
                contenedorCuentasAdmin.innerHTML = "<p style='color: #ef4444; font-size: 0.85rem;'>Error al cargar el listado.</p>";
            }
        }

        // Botón cancelar edición
        btnCancelarEdicion.addEventListener('click', () => {
            formCuenta.reset();
            cuentaIdInput.value = "";
            btnPublicar.textContent = "Publicar Cuenta Nueva";
            tituloModo.innerHTML = "⚡ GESTIONAR <span>CUENTA</span>";
            btnCancelarEdicion.classList.add('hidden');
            mensajeEstado.textContent = "";
        });

        // Guardar (Crear nuevo o actualizar existente)
        formCuenta.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnPublicar.disabled = true;
            btnPublicar.textContent = "Guardando...";

            const idEdicion = cuentaIdInput.value;
            const datosCuenta = {
                server: document.getElementById('server').value,
                imageUrl: document.getElementById('imageUrl').value,
                championCount: document.getElementById('championCount').value,
                currentRank: document.getElementById('currentRank').value,
                riotPoints: document.getElementById('riotPoints').value,
                title: document.getElementById('title').value,
                price: document.getElementById('price').value
            };

            try {
                if (idEdicion) {
                    // Actualizar cuenta existente
                    const cuentaRef = doc(db, "skin", idEdicion);
                    await updateDoc(cuentaRef, datosCuenta);
                    mensajeEstado.style.color = "#38bdf8";
                    mensajeEstado.textContent = "¡Cuenta actualizada con éxito!";
                } else {
                    // Crear cuenta nueva
                    await addDoc(collection(db, "skin"), datosCuenta);
                    mensajeEstado.style.color = "#38bdf8";
                    mensajeEstado.textContent = "¡Cuenta publicada con éxito en la tienda!";
                }

                formCuenta.reset();
                cuentaIdInput.value = "";
                btnPublicar.textContent = "Publicar Cuenta Nueva";
                tituloModo.innerHTML = "⚡ GESTIONAR <span>CUENTA</span>";
                btnCancelarEdicion.classList.add('hidden');
                cargarCuentasAdmin();

            } catch (error) {
                console.error("Error al guardar: ", error);
                mensajeEstado.style.color = "#ef4444";
                mensajeEstado.textContent = "Error: No tenés permisos o falló la conexión.";
            } finally {
                btnPublicar.disabled = false;
                if (!cuentaIdInput.value) {
                    btnPublicar.textContent = "Publicar Cuenta Nueva";
                } else {
                    btnPublicar.textContent = "Guardar Cambios";
                }
            }
        });
    </script>
</body>
</html>
