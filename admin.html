<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store - Panel de Administración</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif, Tahoma, Geneva, Verdana;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-container {
            background-color: #12141c;
            border: 1px solid #1f2430;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #f8fafc;
            text-align: center;
        }

        h2 span {
            color: #f3ba2f;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #1a1f2c;
            border: 1px solid #2a3245;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #f3ba2f;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #f3ba2f;
            color: #0b0e14;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #e0a822;
        }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>⚡ SUBIR <span>CUENTA</span></h2>
        
        <form id="form-cuenta">
            <div class="form-group">
                <label>Servidor</label>
                <select id="server" required>
                    <option value="LAS">LAS (Latinoamérica Sur)</option>
                    <option value="LAN">LAN (Latinoamérica Norte)</option>
                    <option value="NA">NA (North America)</option>
                    <option value="EUW">EUW (Europe West)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cantidad de Campeones</label>
                <input type="text" id="championCount" placeholder="Ej: 30 campeones" required>
            </div>

            <div class="form-group">
                <label>Rango Actual</label>
                <input type="text" id="currentRank" placeholder="Ej: Platino IV / Unranked" required>
            </div>

            <div class="form-group">
                <label>Riot Points (RP)</label>
                <input type="text" id="riotPoints" placeholder="Ej: 2000 RP" required>
            </div>

            <div class="form-group">
                <label>Título de la Cuenta</label>
                <input type="text" id="title" placeholder="Ej: Cuenta Smurf Nivel 30 - Yone Main" required>
            </div>

            <div class="form-group">
                <label>Precio en ARS (Solo números)</label>
                <input type="number" id="price" placeholder="Ej: 15000" required>
            </div>

            <button type="submit" id="btn-publicar">Publicar Cuenta</button>
        </form>

        <div id="mensaje-estado" class="mensaje"></div>
    </div>

    <!-- Script de conexión a Firebase con tus datos reales -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVGo2MoRA0cXgPMb7O3dVxDJVxG_iC1kQ",
            authDomain: "store-51d80.firebaseapp.com",
            projectId: "store-51d80",
            storageBucket: "store-51d80.firebasestorage.app",
            messagingSenderId: "695612329327",
            appId: "1:695612329327:web:298cea611bd736e3a36c9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('form-cuenta');
        const mensajeEstado = document.getElementById('mensaje-estado');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btn-publicar');
            btn.disabled = true;
            btn.textContent = "Publicando...";

            const nuevaCuenta = {
                server: document.getElementById('server').value,
                championCount: document.getElementById('championCount').value,
                currentRank: document.getElementById('currentRank').value,
                riotPoints: document.getElementById('riotPoints').value,
                title: document.getElementById('title').value,
                price: document.getElementById('price').value
            };

            try {
                await addDoc(collection(db, "skin"), nuevaCuenta);
                
                mensajeEstado.style.color = "#38bdf8";
                mensajeEstado.textContent = "¡Cuenta publicada con éxito en la tienda!";
                form.reset();
            } catch (error) {
                console.error("Error al guardar la cuenta: ", error);
                mensajeEstado.style.color = "#ef4444";
                mensajeEstado.textContent = "Hubo un error al publicar. Intentá de nuevo.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Publicar Cuenta";
            }
        });
    </script>
</body>
</html>
