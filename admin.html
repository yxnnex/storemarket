<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 8px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #238636; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Publicar Nueva Cuenta</h2>
        <form id="formPublicarCuenta">
            <label>Título</label>
            <input type="text" id="titulo" required placeholder="Ej: Cuenta nivel 33">

            <label>Servidor</label>
            <select id="servidor">
                <option value="LAN">LAN</option>
                <option value="LAS">LAS</option>
                <option value="NA">NA</option>
                <option value="BR">BR</option>
            </select>

            <label>Campeones</label>
            <input type="number" id="campeones" placeholder="Ej: 23">

            <label>Rango Actual</label>
            <input type="text" id="rango" placeholder="Ej: Unranked">

            <label>EA (Esencia Azul)</label>
            <input type="text" id="esenciaAzul" placeholder="Ej: 45k">

            <label>Precio USD</label>
            <input type="number" id="precio" placeholder="Ej: 5">

            <label>URL de Imagen</label>
            <input type="text" id="imagen" placeholder="https://...">

            <label>Descripción detallada (Detalles de la cuenta)</label>
            <textarea id="descripcionDetallada" rows="6" placeholder="Escribe los detalles completos..."></textarea>

            <button type="submit">Publicar en la Tienda</button>
        </form>
    </div>

    <script>
        // Configuración de Firebase (Asegúrate de poner tus credenciales reales)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('formPublicarCuenta').addEventListener('submit', function(e) {
            e.preventDefault();

            const nuevaCuenta = {
                titulo: document.getElementById('titulo').value,
                servidor: document.getElementById('servidor').value,
                campeones: document.getElementById('campeones').value,
                rango: document.getElementById('rango').value,
                esenciaAzul: document.getElementById('esenciaAzul').value,
                precio: document.getElementById('precio').value,
                imagen: document.getElementById('imagen').value,
                // CAMBIO CLAVE: Se guarda bajo la propiedad 'descripcion' para sincronizar
                descripcion: document.getElementById('descripcionDetallada').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("skin").add(nuevaCuenta)
                .then(() => {
                    alert("¡Cuenta publicada con éxito en la tienda!");
                    document.getElementById('formPublicarCuenta').reset();
                })
                .catch((error) => {
                    console.error("Error al publicar la cuenta: ", error);
                    alert("Hubo un error al publicar.");
                });
        });
    </script>
</body>
</html>
